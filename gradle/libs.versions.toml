[versions]
micronaut-gradle-plugin = "4.6.1"
micronaut = "5.0.0-M16"

managed-postmark = "1.13.0"
managed-sendgrid = "4.10.3"
managed-jakarta-mail = "2.1.5"
managed-eclipse-angus = "2.0.5"
managed-mailjet = "6.0.1"
managed-mailtrap = "1.2.0"
poi-ooxml = "5.5.1"

micronaut-aws = "4.11.0"
micronaut-reactor = "4.0.0-M1"
micronaut-serde = "3.0.0-M1"
micronaut-test-resources = "2.10.1"
micronaut-validation = "5.0.0-M1"
micronaut-views = "5.9.0"
micronaut-hibernate-validator = "4.8.0"

[libraries]
# Managed dependencies
managed-postmark = { module = "com.postmarkapp:postmark", version.ref = "managed-postmark" }
managed-sendgrid-java = { module = "com.sendgrid:sendgrid-java", version.ref = "managed-sendgrid" }
managed-jakarta-mail = { module = "jakarta.mail:jakarta.mail-api", version.ref = "managed-jakarta-mail" }
managed-eclipse-angus = { module = "org.eclipse.angus:angus-mail", version.ref = "managed-eclipse-angus" }
managed-mailjet-client = { module = "com.mailjet:mailjet-client", version.ref = "managed-mailjet" }
managed-mailtrap = { module = "io.mailtrap:mailtrap-java", version.ref = "managed-mailtrap" }

# Micronaut
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-aws = {module = "io.micronaut.aws:micronaut-aws-bom", version.ref = "micronaut-aws" }
micronaut-hibernate-validator = {module = "io.micronaut.beanvalidation:micronaut-hibernate-validator-bom", version.ref = "micronaut-hibernate-validator" }
micronaut-reactor = { module = 'io.micronaut.reactor:micronaut-reactor-bom', version.ref = "micronaut-reactor" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-test-resources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-test-resources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-views = {module = "io.micronaut.views:micronaut-views-bom", version.ref = "micronaut-views" }

junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi-ooxml" }
ses = { module = "software.amazon.awssdk:ses" }

# Plugins
micronaut-gradle-plugin = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref="micronaut-gradle-plugin" }
